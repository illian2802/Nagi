[package]
name = "nagi-browser"
version = "0.3.3"
edition = "2024"
rust-version = "1.88"
description = "Lightweight desktop browser for Windows and macOS"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = { version = "0.37.3", default-features = false, features = ["rwh_06"] }
url = "2.5"
wry = { version = "0.57.3", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSGraphics", "NSView"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true




