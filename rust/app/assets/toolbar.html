    :root { color-scheme: light; font: 13px "Nagi Sans", "Segoe UI", sans-serif; background: transparent; color: #17212e; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 108px; padding: 8px 14px 10px; background: #f5f7fa; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .tab-row { height: 38px; display: flex; align-items: center; gap: 12px; }
    .loading-track { position: absolute; z-index: 2; top: 106px; right: 0; left: 0; height: 2px; overflow: hidden; pointer-events: none; }
    .loading-line { width: 32%; height: 100%; background: #36a994; opacity: 0; transform: translateX(-100%); }
    .loading-track.loading .loading-line { opacity: 1; animation: load-sweep 1.2s ease-in-out infinite; }
    .loading-track.done .loading-line { width: 100%; opacity: 1; transform: none; transition: width 130ms ease, opacity 240ms ease 100ms; }
    @keyframes load-sweep { 0% { transform: translateX(-100%); } 70%, 100% { transform: translateX(320%); } }
    .brand { display: flex; align-items: center; gap: 8px; flex: 0 0 86px; user-select: none; }
    .brand-mark svg { display:block; width:18px; height:17px; }
    .brand-mark { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px; background: #142c3b; color: #70d6c2; font-size: 14px; font-weight: 600; }
    .brand-name { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
    .tabs { display: flex; align-items: center; align-self: stretch; gap: 4px; min-width: 0; flex: 1; overflow: hidden; }
    .tab { position: relative; height: 32px; min-width: 104px; max-width: 220px; flex: 1 1 170px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: #617080; text-align: left; transition: background 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease; }
    .tab:hover { background: #e9edf2; }
    .tab.active { background: #fff; border-color: #e5e9ee; color: #17212e; box-shadow: 0 1px 2px #142c3b0b; }
    .tab-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: #8da0ad; }
    .tab.active .tab-dot { background: #36a994; }
    .tab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .close-tab { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: #7a8793; font-size: 16px; line-height: 1; opacity: .62; transition: background 140ms ease, opacity 140ms ease, transform 140ms ease; }
    .close-tab:hover { background: #e9edf2; opacity: 1; transform: scale(1.08); }
    .icon-button { display: inline-grid; width: 34px; height: 34px; flex: 0 0 34px; place-items: center; border: 0; border-radius: 8px; background: transparent; color: #526170; transition: background 140ms ease, color 140ms ease, transform 140ms ease; }
    .icon-button:hover { background: #e8edf2; color: #17212e; }
    .icon-button:active { background: #dfe7eb; transform: scale(.93); }
    .icon-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .icon-button:disabled { opacity: .38; cursor: default; }
    .icon-button:disabled:active { transform: none; }
    .new-tab { width: 30px; height: 30px; flex: 0 0 30px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: #526170; font-size: 21px; transition: background 140ms ease, color 140ms ease, transform 140ms ease; }
    .new-tab:hover { background: #e8edf2; }
    .nav-row { height: 46px; display: flex; align-items: center; gap: 4px; padding-top: 5px; }
    .address-wrap { height: 38px; min-width: 120px; flex: 1; display: flex; align-items: center; gap: 9px; margin-left: 6px; padding: 0 12px; border: 1px solid #dce2e8; border-radius: 9px; background: #fff; transition: border-color 140ms ease, box-shadow 140ms ease; }
    .address-wrap:focus-within { border-color: #45aa98; box-shadow: 0 0 0 2px #45aa981a; }
    .address-wrap svg { width: 16px; height: 16px; flex: 0 0 16px; fill: none; stroke: #72818d; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    #address { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: #1d2935; font: inherit; }
    #address::placeholder { color: #87939e; }
    .address-hint { padding: 2px 6px; border: 1px solid #e6eaee; border-radius: 4px; color: #89949e; font-size: 11px; }
    .star-button { color: #697987; }
    .tool-button { color: #697987; }
    .shield-button { width: auto; padding: 0 10px; display: flex; gap: 7px; font-size: 12px; color: #4f6170; }
    .shield-button svg { width: 16px; height: 16px; color: #328e7e; }
    .popover { position: absolute; z-index: 1000; top: 99px; right: 14px; width: min(360px, calc(100vw - 28px)); max-height: calc(100% - 110px); overflow-y: auto; padding: 8px; border: 1px solid #e0e5ea; border-radius: 12px; background: #fff; box-shadow: 0 12px 32px #17212e1c; transform-origin: top right; animation: panel-in 170ms cubic-bezier(.2,.75,.25,1) both; }
    .popover[hidden] { display: none; }
    @keyframes panel-in { from { opacity: 0; transform: translateY(-7px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .popover-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 9px 10px; }
    .popover-title { font-size: 14px; font-weight: 500; }
    .popover-meta { color: #72808b; font-size: 12px; }
    .panel-tabs { display: flex; gap: 4px; padding: 0 5px 8px; border-bottom: 1px solid #edf0f2; }
    .panel-tab { padding: 6px 9px; border: 0; border-radius: 6px; background: transparent; color: #6d7b87; font-size: 12px; transition: background 140ms ease, color 140ms ease; }
    .panel-tab:hover { background: #f1f4f6; }
    .panel-tab.active { background: #eaf3f1; color: #237968; }
    .popover-note { display: flex; align-items: flex-start; gap: 10px; margin: 2px 4px 8px; padding: 12px; border-radius: 8px; background: #f4f7f8; color: #4d5c68; line-height: 1.45; }
    .popover-note svg { width: 17px; height: 17px; flex: 0 0 17px; color: #328e7e; fill: none; stroke: currentColor; stroke-width: 1.7; }
    .bookmark-list { max-height: 280px; overflow: auto; }
    .bookmark-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 7px; background: transparent; text-align: left; transition: background 130ms ease, transform 130ms ease; }
    .bookmark-item:hover { background: #f2f5f7; }
    .bookmark-item:active { transform: scale(.99); }
    .bookmark-item svg { width: 16px; height: 16px; flex: 0 0 16px; fill: none; stroke: #71808c; stroke-width: 1.5; }
    .bookmark-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty-bookmarks { padding: 12px; color: #74828d; font-size: 12px; }
    .download-status { margin-left: auto; color: #6c7b87; font-size: 11px; }
    .folder-button { width: calc(100% - 8px); margin: 7px 4px 2px; padding: 8px 10px; border: 1px solid #e1e7eb; border-radius: 7px; background: #fff; text-align: left; font-size: 12px; }
    .folder-button:hover { background: #f3f6f8; }
    .folder-button:disabled { cursor: default; opacity: .6; }
    .update-status { color: #74828d; font-size: 11px; }
    .settings-panel { display: grid; gap: 12px; padding: 12px 8px 4px; }
    .setting-row { display: grid; gap: 6px; color: #596875; font-size: 12px; }
    .setting-row select { width: 100%; padding: 8px 10px; border: 1px solid #dce2e8; border-radius: 7px; background: #fff; color: #17212e; font: inherit; }
    .setting-check { display: flex; align-items: center; gap: 9px; color: #455461; font-size: 12px; }
    .setting-check input { width: 15px; height: 15px; margin: 0; accent-color: #278a79; }
    .vpn-panel { display: grid; gap: 7px; padding: 10px; border: 1px solid #dce2e8; border-radius: 8px; background: #f8fafb; }
    .vpn-panel strong { color: #263541; font-size: 12px; font-weight: 600; }
    .vpn-status { color: #667581; font-size: 11px; line-height: 1.4; }
    .vpn-actions { display: grid; grid-template-columns: 1fr auto; gap: 7px; }
    .vpn-panel[hidden], .vpn-country-row[hidden], .vpn-help[hidden] { display: none; }
    :root[data-theme="dark"] .vpn-panel { background: #1c2933; border-color: #3a4a55; }
    :root[data-theme="dark"] .vpn-panel strong { color: #e0e9ee; }

    function renderVpn(settings) {
      const copy = vpnStrings[language] || vpnStrings.en;
      vpnPlatform = settings.vpn_platform || 'external';
      vpnConnected = settings.vpn_connected === true;
      const linuxControl = vpnPlatform === 'linux';
      document.getElementById('vpn-region-label').textContent = copy.region;
      document.querySelector('#vpn-country option[value="fastest"]').textContent = copy.fastest;
      document.getElementById('vpn-country-row').hidden = !linuxControl;
      document.getElementById('vpn-help').hidden = !linuxControl;
      document.getElementById('vpn-toggle').textContent = linuxControl ? (vpnConnected ? copy.disconnect : copy.connect) : copy.open;
      document.getElementById('vpn-toggle').disabled = linuxControl && settings.vpn_busy === true;
      document.getElementById('vpn-country').value = settings.vpn_country || 'fastest';
      document.getElementById('vpn-status').textContent = copy[settings.vpn_status] || copy.error;
    }

    function parseStableVersion(value) {
      const match = /^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(value || '');
      if (!match) return null;
      const parts = match.slice(1).map(Number);
      return parts.every(Number.isSafeInteger) ? parts : null;
    }

    function isNewerVersion(latest, current) {
      const latestParts = parseStableVersion(latest);
      const currentParts = parseStableVersion(current);
      if (!latestParts || !currentParts) return false;
      for (let index = 0; index < 3; index++) {
        if (latestParts[index] !== currentParts[index]) return latestParts[index] > currentParts[index];
      }
      return false;
    }

    function checkForUpdates(repository, currentVersion, assetName, force = false) {
      const key = `${repository}|${currentVersion}|${assetName}`;
      updateRepository = repository;
      updateCurrentVersion = currentVersion;
      updateAssetName = assetName;
      if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) {
        updateButton.removeAttribute('data-url');
        updateButton.disabled = true;
        updateStatus.textContent = `${t('currentVersion')}: ${currentVersion || '—'}`;
        return;
      }
      if (force) checkedUpdateKey = '';
      if (checkedUpdateKey === key) return;
      checkedUpdateKey = key;
      updateButton.removeAttribute('data-url');
      updateButton.disabled = true;
      updateStatus.textContent = t('checkingUpdates');
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);
      fetch(`https://api.github.com/repos/${repository}/releases/latest`, {
        headers: { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
        cache: 'default', signal: controller.signal
      }).then(response => {
        if (!response.ok) throw new Error('Release unavailable');
        return response.json();
      }).then(release => {
        const asset = release.assets?.find(item => item.name === assetName);
        const latestVersion = parseStableVersion(release.tag_name || '');
        const assetUrl = (() => {
          try { return new URL(asset?.browser_download_url || ''); } catch { return null; }
        })();
        const expectedPath = `/${repository}/releases/download/${release.tag_name}/${assetName}`;
        const safeAsset = assetUrl?.protocol === 'https:' && assetUrl.hostname === 'github.com' && !assetUrl.port
          && assetUrl.username === '' && assetUrl.password === '' && !assetUrl.search && !assetUrl.hash
          && assetUrl.pathname === expectedPath;
        if (release.draft === true || release.prerelease === true || !latestVersion || !safeAsset) {
          throw new Error('Invalid or incomplete GitHub release');
        }
        if (isNewerVersion(release.tag_name, currentVersion)) {
          updateButton.dataset.url = assetUrl.href;
          updateButton.textContent = `${t('downloadUpdate')} ${release.tag_name}`;
          updateStatus.textContent = t('updateReady');
          updateButton.disabled = false;
          const notificationKey = `${key}|${release.tag_name}`;
          if (notifiedUpdateKey !== notificationKey) {
            notifiedUpdateKey = notificationKey;
            currentPanel = 'settings';
            setPopoverOpen(true);
            renderPanel();
          }
        } else {
          updateButton.textContent = t('checkUpdates');
          updateStatus.textContent = t('upToDate');
          updateButton.disabled = false;
        }
      }).catch(() => {
        updateButton.textContent = t('checkUpdates');
        updateStatus.textContent = t('updatesUnavailable');
        updateButton.removeAttribute('data-url');
        updateButton.disabled = false;
        checkedUpdateKey = '';
      }).finally(() => {
        clearTimeout(timeout);
      });
    }

    function setPopoverOpen(open) {
      const wasOpen = !popover.hidden;
      popover.hidden = !open;
      shield.setAttribute('aria-expanded', String(open));
      if (wasOpen !== open) send('popover-state', { open });
    }

    window.nagiSetState = ({ tabs: items, address: currentAddress, bookmarks = [], history = [], downloads = [], bookmarked = false, settings = {}, loading = false, can_go_back = false, can_go_forward = false }) => {
      language = window.NagiI18n.normalize(settings.language || 'en');
      window.NagiI18n.apply(document, language);
      languageSelect.value = language;
      tabs.replaceChildren();
      for (const item of items) {
        const tab = document.createElement('button');
        tab.className = `tab${item.active ? ' active' : ''}`;
        tab.type = 'button';
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-selected', String(item.active));
        const tabLabel = item.label === 'Nouvel onglet' ? t('newTab') : item.label;
        tab.title = tabLabel;
        tab.addEventListener('click', () => send('activate-tab', { tab_id: item.id }));
        const dot = document.createElement('span'); dot.className = 'tab-dot'; dot.setAttribute('aria-hidden', 'true');
        const label = document.createElement('span'); label.className = 'tab-label'; label.textContent = tabLabel;
        const close = document.createElement('span'); close.className = 'close-tab'; close.textContent = '×'; close.title = t('closeTab'); close.setAttribute('role', 'button'); close.tabIndex = 0;
        close.addEventListener('click', event => { event.stopPropagation(); send('close-tab', { tab_id: item.id }); });
        close.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); event.stopPropagation(); send('close-tab', { tab_id: item.id }); } });
        tab.append(dot, label, close); tabs.append(tab);
      }
      const add = document.createElement('button'); add.className = 'new-tab'; add.type = 'button'; add.textContent = '+'; add.title = t('newTab'); add.setAttribute('aria-label', t('newTab')); add.addEventListener('click', () => send('new-tab')); tabs.append(add);
      if (document.activeElement !== address) address.value = currentAddress || '';
      document.querySelector('[data-action="back"]').disabled = !can_go_back;
      document.querySelector('[data-action="forward"]').disabled = !can_go_forward;
      activeBookmarked = bookmarked;
      star.setAttribute('aria-label', bookmarked ? t('removeFavorite') : t('addFavorite'));
      star.title = bookmarked ? t('removeFavorite') : t('addFavorite');
      star.style.color = bookmarked ? '#248a79' : '';
      panels = { bookmarks, history, downloads };
      document.documentElement.dataset.theme = settings.dark_mode ? 'dark' : 'light';
      document.getElementById('theme-select').value = settings.dark_mode ? 'dark' : 'light';
      document.getElementById('search-engine').value = settings.search_engine || 'google';
      const adBlockingRow = document.getElementById('ad-blocking-row');
      adBlockingAvailable = settings.ad_blocking_available !== false;
      adBlockingRow.hidden = !adBlockingAvailable;
      document.getElementById('ad-blocking').checked = settings.ad_blocking === true;
      document.getElementById('restore-last-page').checked = settings.restore_last_page !== false;
      renderVpn(settings);
      checkForUpdates(settings.update_repository || '', settings.version || '', settings.update_asset || 'Nagi-Installer.exe');
      const progress = document.getElementById('loading-track');
      if (loading) { progress.classList.remove('done'); progress.classList.add('loading'); }
      else if (progress.classList.contains('loading')) {
        progress.classList.remove('loading'); progress.classList.add('done');
        setTimeout(() => progress.classList.remove('done'), 420);
      }
      renderPanel();
    };

    function renderPanel() {
      const list = document.getElementById('bookmark-list');
      const items = panels[currentPanel] || [];
      const titleKeys = { bookmarks: 'favorites', history: 'history', downloads: 'downloads', settings: 'settings' };
      document.getElementById('popover-title').textContent = t(titleKeys[currentPanel]);
      document.getElementById('panel-count').textContent = currentPanel === 'settings' ? '' : `${items.length}`;
      document.getElementById('protection-note').hidden = currentPanel !== 'bookmarks' || !adBlockingAvailable;
      document.getElementById('downloads-folder').hidden = currentPanel !== 'downloads';
      document.getElementById('settings-panel').hidden = currentPanel !== 'settings';
      list.hidden = currentPanel === 'settings';
      document.querySelectorAll('.panel-tab').forEach(button => button.classList.toggle('active', button.dataset.panel === currentPanel));
      list.replaceChildren();
      if (!items.length) {
        const empty = document.createElement('div'); empty.className = 'empty-bookmarks';
        empty.textContent = currentPanel === 'bookmarks' ? t('emptyFavorites') : currentPanel === 'history' ? t('emptyHistory') : currentPanel === 'downloads' ? t('emptyDownloads') : '';
        list.append(empty); return;
      }
      items.forEach((item, index) => {
        const button = document.createElement('button'); button.className = 'bookmark-item'; button.type = 'button'; button.title = item.url;
        button.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 4.8A1.8 1.8 0 0 1 7.8 3h8.4A1.8 1.8 0 0 1 18 4.8V21l-6-3.8L6 21z"/></svg>';
        const name = document.createElement('span'); name.className = 'bookmark-name'; name.textContent = currentPanel === 'downloads' ? item.name : item.title;
        button.replaceChildren(name);
        if (currentPanel === 'downloads') {
          const status = document.createElement('span'); status.className = 'download-status'; status.textContent = item.complete ? (item.success ? t('done') : t('failed')) : t('inProgress'); button.append(status);
        }
        button.addEventListener('click', () => {
          if (currentPanel === 'bookmarks') send('open-bookmark', { index });
          else if (currentPanel === 'history') send('open-history', { index });
          else send('open-download', { index });
          if (currentPanel !== 'downloads' || (item.complete && item.success)) setPopoverOpen(false);
        });
        list.append(button);
      });
    }

    document.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (button) {
        send(button.dataset.action);
        if (button.id === 'reload-button') { button.classList.remove('is-loading'); void button.offsetWidth; button.classList.add('is-loading'); setTimeout(() => button.classList.remove('is-loading'), 650); }
      }
      if (!event.target.closest('#popover') && !event.target.closest('#shield-button') && !event.target.closest('#history-button') && !event.target.closest('#downloads-button')) setPopoverOpen(false);
    });
    shield.addEventListener('click', () => setPopoverOpen(popover.hidden));
    document.getElementById('history-button').addEventListener('click', () => { currentPanel = 'history'; setPopoverOpen(true); renderPanel(); });
    document.getElementById('downloads-button').addEventListener('click', () => { currentPanel = 'downloads'; setPopoverOpen(true); renderPanel(); });
    document.querySelectorAll('.panel-tab').forEach(button => button.addEventListener('click', () => { currentPanel = button.dataset.panel; renderPanel(); }));
    document.getElementById('downloads-folder').addEventListener('click', () => send('open-downloads-folder'));
    document.getElementById('theme-select').addEventListener('change', event => send('set-preference', { preference: 'theme', value: event.target.value }));
    document.getElementById('search-engine').addEventListener('change', event => send('set-preference', { preference: 'search_engine', value: event.target.value }));
    document.getElementById('ad-blocking').addEventListener('change', event => send('set-preference', { preference: 'ad_blocking', value: event.target.checked ? 'on' : 'off' }));
    document.getElementById('restore-last-page').addEventListener('change', event => send('set-preference', { preference: 'restore_last_page', value: event.target.checked ? 'on' : 'off' }));
    languageSelect.addEventListener('change', event => send('set-preference', { preference: 'language', value: event.target.value }));
    document.getElementById('vpn-country').addEventListener('change', event => send('set-preference', { preference: 'vpn_country', value: event.target.value }));
    document.getElementById('vpn-toggle').addEventListener('click', () => {
      if (vpnPlatform !== 'linux') send('open-proton-app');
      else send(vpnConnected ? 'vpn-disconnect' : 'vpn-connect', { country: document.getElementById('vpn-country').value });
    });
    document.getElementById('vpn-help').addEventListener('click', () => send('open-proton-help'));
    document.getElementById('clear-history').addEventListener('click', () => send('clear-history'));
    updateButton.addEventListener('click', () => {
      if (updateButton.dataset.url) send('open-update', { url: updateButton.dataset.url });
      else checkForUpdates(updateRepository, updateCurrentVersion, updateAssetName, true);
    });
    document.getElementById('address-form').addEventListener('submit', event => { event.preventDefault(); send('navigate', { url: address.value }); });
    address.addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); send('navigate', { url: address.value }); } });
    document.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'l') { event.preventDefault(); address.focus(); address.select(); }
      else if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === 't') { event.preventDefault(); send('reopen-tab'); }
      else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 't') { event.preventDefault(); send('new-tab'); }
      else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'w') { event.preventDefault(); send('close-tab'); }
      else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'r') { event.preventDefault(); send('reload'); }
      else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'd') { event.preventDefault(); send('bookmark'); }
      else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'h') { event.preventDefault(); currentPanel = 'history'; setPopoverOpen(true); renderPanel(); }
      else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'j') { event.preventDefault(); currentPanel = 'downloads'; setPopoverOpen(true); renderPanel(); }
      else if ((event.ctrlKey || event.metaKey) && event.key === ',') { event.preventDefault(); currentPanel = 'settings'; setPopoverOpen(true); renderPanel(); }
      else if (event.key === 'Escape') setPopoverOpen(false);
    });
  </script>
</body>
</html>
