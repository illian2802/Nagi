<svg xmlns="http://www.w3.org/2000/svg" width="1365" height="820" viewBox="0 0 1365 820"><rect width="1365" height="820" fill="#f4f6f4"/><g font-family="Segoe UI,Arial,sans-serif" fill="#202824"><path d="M70 78H1295" stroke="#dfe5df"/><rect x="70" y="23" width="30" height="30" rx="9" fill="#19362e"/><text x="85" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#8ce1c6">N</text><text x="110" y="44" font-size="18" font-weight="700">Nagi</text><text x="970" y="43" font-size="13" fill="#4b5851">Features</text><text x="1040" y="43" font-size="13" fill="#4b5851">Privacy</text><rect x="1115" y="20" width="100" height="38" rx="6" fill="none" stroke="#bac9c1"/><text x="1165" y="44" text-anchor="middle" font-size="13">Download</text><text x="72" y="148" font-size="11" font-weight="700" letter-spacing="1" fill="#286d5b">● BUILT FOR WINDOWS</text><text x="70" y="238" font-size="78" font-weight="600" letter-spacing="-5">Make room</text><text x="70" y="312" font-size="78" font-weight="600" letter-spacing="-5">for the <tspan fill="#286d5b">web.</tspan></text><text x="74" y="362" font-size="16" fill="#5e6962">A focused browser that starts quickly and keeps</text><text x="74" y="388" font-size="16" fill="#5e6962">the useful things close. Powered by Windows’</text><text x="74" y="414" font-size="16" fill="#5e6962">built-in WebView2 engine.</text><rect x="70" y="446" width="198" height="51" rx="6" fill="#286d5b"/><text x="92" y="477" font-size="14" font-weight="600" fill="white">Download Nagi　↗</text><text x="283" y="466" font-size="11" fill="#77817b">Windows 10 / 11 · 64-bit</text><text x="283" y="484" font-size="11" fill="#77817b">Free · No account required</text><rect x="685" y="130" width="545" height="382" rx="9" fill="#fff" stroke="#d5ded7"/><path d="M686 174h543" stroke="#edf1ed" stroke-width="42"/><rect x="703" y="153" width="21" height="21" rx="6" fill="#19362e"/><text x="713" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#8ce1c6">N</text><rect x="737" y="148" width="235" height="26" rx="6" fill="white"/><circle cx="751" cy="161" r="3" fill="#4f9b7e"/><text x="762" y="165" font-size="10" fill="#56635b">A quieter place to browse</text><path d="M686 220h543" stroke="#e8ede8"/><text x="703" y="205" font-size="15" fill="#77837c">‹　›　↻</text><rect x="766" y="186" width="370" height="27" rx="5" fill="#fafbfa" stroke="#e0e5e1"/><text x="779" y="204" font-size="10" fill="#77817b">⌕　Search or enter an address</text><rect x="686" y="221" width="543" height="290" fill="#fbfcfb"/><rect x="937" y="252" width="41" height="41" rx="13" fill="#19362e"/><text x="958" y="281" text-anchor="middle" font-size="25" font-weight="700" fill="#8ce1c6">N</text><text x="957" y="317" text-anchor="middle" font-size="8" letter-spacing="2" fill="#73817a">YOUR BROWSING SPACE</text><text x="957" y="360" text-anchor="middle" font-size="27" font-weight="500">The web,</text><text x="957" y="391" text-anchor="middle" font-size="27" font-weight="500" fill="#286d5b">without detours.</text><rect x="824" y="410" width="265" height="38" rx="6" fill="#fff" stroke="#e1e7e2"/><text x="839" y="434" font-size="10" fill="#8a948e">Search the web</text><rect x="1054" y="419" width="22" height="19" rx="3" fill="#fff" stroke="#e0e5e1"/><text x="1065" y="433" text-anchor="middle" font-size="10" fill="#8a948e">↵</text><text x="957" y="479" text-anchor="middle" font-size="12" fill="#758079">W　 G　 +</text><path d="M70 566H1295M70 646H1295" stroke="#dfe5df"/><text x="70" y="599" font-size="13" font-weight="600">Lightweight</text><text x="70" y="624" font-size="11" fill="#77817b">No second browser engine to install</text><path d="M482 580v44M896 580v44" stroke="#dfe5df"/><text x="512" y="599" font-size="13" font-weight="600">Private by default</text><text x="512" y="624" font-size="11" fill="#77817b">Your profile stays on this PC</text><text x="927" y="599" font-size="13" font-weight="600">Simple to switch</text><text x="927" y="624" font-size="11" fill="#77817b">Bookmarks, history and passwords</text><text x="70" y="700" font-size="11" font-weight="700" letter-spacing="1" fill="#286d5b">THE ESSENTIALS, CONSIDERED</text><text x="70" y="758" font-size="43" font-weight="600" letter-spacing="-2">Less browser.</text><text x="70" y="802" font-size="43" font-weight="600" fill="#286d5b" letter-spacing="-2">More breathing room.</text></g></svg>
