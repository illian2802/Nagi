name: Check browser builds

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos-build:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-latest
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build app
        env:
          NAGI_GITHUB_REPOSITORY: ${{ github.repository }}
        run: cargo build --release --locked --target "${{ matrix.target }}" --manifest-path rust/app/Cargo.toml
